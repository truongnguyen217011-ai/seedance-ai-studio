[pytest]
testpaths = tests
markers =
    integration: test tích hợp chạy worker thật + Chromium + fake Dola (chậm)
    timeout(seconds): giới hạn thời gian một test (cần pytest-timeout, xem requirements-dev.txt)
# pytest-timeout: mặc định 180 s cho mọi test (test tích hợp dùng cùng giá trị qua marker;
# test đơn vị xong trong < 1 s nên không bị ảnh hưởng). Không cài pytest-timeout thì chỉ ra cảnh báo.
timeout = 180
